# PSF API only — dedicated vhost (does NOT change other sites on this server).
# Requires: mod_proxy, mod_proxy_http
#
# Only requests with Host: api.psfnew.nchads.gov.kh use this block.
# Other apps (takemehomeapi, htdocs, port 2086, etc.) are unchanged.

<VirtualHost *:80>
    ServerName api.psfnew.nchads.gov.kh

    ProxyRequests Off
    ProxyPreserveHost On

    ProxyPass /api http://127.0.0.1:3000/api
    ProxyPassReverse /api http://127.0.0.1:3000/api

    SetEnvIf Authorization "(.*)" HTTP_AUTHORIZATION=$1
    RequestHeader set Authorization "%{HTTP_AUTHORIZATION}e" env=HTTP_AUTHORIZATION

    ErrorLog "C:/xampp/apache/logs/psf-api-error.log"
    CustomLog "C:/xampp/apache/logs/psf-api-access.log" common
</VirtualHost>

