# PSF admin SPA + API — host: psfnew.nchads.gov.kh only (other sites unchanged)
# Port 80: local/LAN. Port 2087: pfSense HAProxy WAN backend (same as prep→2086).

<VirtualHost *:80>
    ServerName psfnew.nchads.gov.kh
    DocumentRoot "C:/xampp/htdocs/psfnew"

    ProxyRequests Off
    ProxyPreserveHost On

    # API first — before any SPA rewrite
    ProxyPass /api http://127.0.0.1:3000/api
    ProxyPassReverse /api http://127.0.0.1:3000/api

    SetEnvIf Authorization "(.*)" HTTP_AUTHORIZATION=$1
    RequestHeader set Authorization "%{HTTP_AUTHORIZATION}e" env=HTTP_AUTHORIZATION

    <Directory "C:/xampp/htdocs/psfnew">
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    ErrorLog "C:/xampp/apache/logs/psfnew-error.log"
    CustomLog "C:/xampp/apache/logs/psfnew-access.log" common
</VirtualHost>

<VirtualHost *:2087>
    ServerName psfnew.nchads.gov.kh
    DocumentRoot "C:/xampp/htdocs/psfnew"

    ProxyRequests Off
    ProxyPreserveHost On

    ProxyPass /api http://127.0.0.1:3000/api
    ProxyPassReverse /api http://127.0.0.1:3000/api

    SetEnvIf Authorization "(.*)" HTTP_AUTHORIZATION=$1
    RequestHeader set Authorization "%{HTTP_AUTHORIZATION}e" env=HTTP_AUTHORIZATION

    <Directory "C:/xampp/htdocs/psfnew">
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    ErrorLog "C:/xampp/apache/logs/psfnew-2087-error.log"
    CustomLog "C:/xampp/apache/logs/psfnew-2087-access.log" common
</VirtualHost>
