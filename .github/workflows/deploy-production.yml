# Auto-deploy to Windows production (psfnew.nchads.gov.kh) on push to main.
#
# Required GitHub repo secrets (Settings → Secrets and variables → Actions):
#   WIN_SSH_HOST   — e.g. 0.tcp.ap.ngrok.io
#   WIN_SSH_PORT   — e.g. 14155
#   WIN_SSH_USER   — e.g. Administrator
#   WIN_SSH_PASS   — Windows SSH password
# Optional: PRODUCTION_URL — default https://psfnew.nchads.gov.kh
#
# ngrok SSH on the Windows server must be running when this workflow runs.

name: Deploy production (Windows)

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - 'frontend/**'
      - 'deploy/**'
      - 'deploy.sh'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/deploy-production.yml'
  workflow_dispatch:

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install deploy tools
        run: sudo apt-get update && sudo apt-get install -y sshpass zip

      - name: Deploy backend + frontend
        env:
          WIN_SSH_HOST: ${{ secrets.WIN_SSH_HOST }}
          WIN_SSH_PORT: ${{ secrets.WIN_SSH_PORT }}
          WIN_SSH_USER: ${{ secrets.WIN_SSH_USER }}
          WIN_SSH_PASS: ${{ secrets.WIN_SSH_PASS }}
          PRODUCTION_URL: ${{ secrets.PRODUCTION_URL }}
        run: |
          set -euo pipefail
          for var in WIN_SSH_HOST WIN_SSH_PORT WIN_SSH_USER WIN_SSH_PASS; do
            if [[ -z "${!var:-}" ]]; then
              echo "::error::Missing GitHub secret: $var"
              exit 1
            fi
          done
          export PRODUCTION_URL="${PRODUCTION_URL:-https://psfnew.nchads.gov.kh}"
          chmod +x deploy.sh deploy/windows/*.sh
          ./deploy/windows/deploy-all.sh all
